name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag containing the distributions
        required: true
        default: v0.2.1
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download release distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern 'mxfp6_sm120-*'
          test "$(find dist -maxdepth 1 -type f | wc -l)" -ge 2
          sha256sum dist/*
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
